<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Leominal · Terminal Redesign</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap"
    rel="stylesheet"
  />

  <style>
    html, body, #root { height: 100%; margin: 0; }
    body { background: #f0eee9; font-family: 'Inter', system-ui, sans-serif; }
  </style>

  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel" src="design-canvas.jsx"></script>
  <script type="text/babel" src="shared.jsx"></script>
  <script type="text/babel" src="variant-warp.jsx"></script>
  <script type="text/babel" src="variant-cyber.jsx"></script>
  <script type="text/babel" src="variant-minimal.jsx"></script>

  <script type="text/babel">
    const { useState } = React;

    function App() {
      return (
        <DesignCanvas>
          <DCSection
            id="desktop"
            title="Desktop · 1440 × 900"
            subtitle="세 가지 방향. 모두 사이드바 + 탭 + 분할 패널 구조는 유지하되 chrome / 색 / 위계가 다릅니다."
          >
            <DCArtboard id="warp-desktop" label="A · Warp — 정돈된 프리미엄" width={1440} height={900}>
              <div style={{ width: '100%', height: '100%' }}>
                <VariantWarp />
              </div>
            </DCArtboard>

            <DCArtboard id="cyber-desktop" label="B · Command — 네온 모노스페이스" width={1440} height={900}>
              <div style={{ width: '100%', height: '100%' }}>
                <VariantCyber />
              </div>
            </DCArtboard>

            <DCArtboard id="minimal-desktop" label="C · Minimal — 텍스트 우선" width={1440} height={900}>
              <div style={{ width: '100%', height: '100%' }}>
                <VariantMinimal />
              </div>
            </DCArtboard>
          </DCSection>

          <DCSection
            id="mobile"
            title="Mobile · 390 × 844"
            subtitle="모바일에서는 사이드바를 햄버거 뒤로 숨기고, 화면 하단에 큰 액션 바를 둡니다."
          >
            <DCArtboard id="warp-mobile" label="A · Warp — Mobile" width={390} height={844}>
              <div style={{ width: '100%', height: '100%' }}>
                <VariantWarp mobile />
              </div>
            </DCArtboard>

            <DCArtboard id="cyber-mobile" label="B · Command — Mobile" width={390} height={844}>
              <div style={{ width: '100%', height: '100%' }}>
                <VariantCyber mobile />
              </div>
            </DCArtboard>

            <DCArtboard id="minimal-mobile" label="C · Minimal — Mobile" width={390} height={844}>
              <div style={{ width: '100%', height: '100%' }}>
                <VariantMinimal mobile />
              </div>
            </DCArtboard>
          </DCSection>

          <DCSection
            id="details"
            title="Detail studies"
            subtitle="요청하신 디테일들 — 접힌 사이드바, 분할 패널 사이의 드래그 핸들, 버튼 모음."
          >
            <DCArtboard id="collapsed-sidebar" label="사이드바 접힘 (Warp)" width={1100} height={620}>
              <div style={{ width: '100%', height: '100%' }}>
                <VariantWarp collapsedSidebar />
              </div>
            </DCArtboard>

            <DCArtboard id="divider-study" label="패널 드래그 핸들" width={640} height={420}>
              <DividerStudy />
            </DCArtboard>

            <DCArtboard id="button-study" label="버튼 · 인터랙션 상태" width={640} height={520}>
              <ButtonStudy />
            </DCArtboard>
          </DCSection>
        </DesignCanvas>
      );
    }

    /* ---------- Detail studies ---------- */

    function DividerStudy() {
      return (
        <div className="ds-shell">
          <style>{detailCss}</style>
          <div className="ds-row">
            <div className="ds-pane">Pane A</div>
            <div className="ds-div ds-div-v" data-state="rest">
              <div className="ds-handle"><span /><span /><span /><span /></div>
              <div className="ds-tooltip">DRAG ↔</div>
            </div>
            <div className="ds-pane">Pane B</div>
          </div>
          <div className="ds-states">
            <div className="ds-state">
              <div className="ds-state-label">REST</div>
              <div className="ds-mini">
                <div className="ds-mini-pane" /><div className="ds-mini-div ds-rest" /><div className="ds-mini-pane" />
              </div>
            </div>
            <div className="ds-state">
              <div className="ds-state-label">HOVER</div>
              <div className="ds-mini">
                <div className="ds-mini-pane" /><div className="ds-mini-div ds-hover" /><div className="ds-mini-pane" />
              </div>
            </div>
            <div className="ds-state">
              <div className="ds-state-label">DRAG</div>
              <div className="ds-mini">
                <div className="ds-mini-pane" /><div className="ds-mini-div ds-drag" /><div className="ds-mini-pane" />
              </div>
            </div>
          </div>
          <p className="ds-note">
            패널 경계 위에 마우스를 올리면 핸들이 시안 컬러로 강조되고, 드래그 중에는 양쪽 끝까지 가이드 라인이 확장됩니다.
            모바일에서는 핸들 영역을 16px까지 확장해 손가락으로 잡을 수 있게 합니다.
          </p>
        </div>
      );
    }

    function ButtonStudy() {
      return (
        <div className="bs-shell">
          <style>{detailCss}</style>

          <BSGroup label="기본 버튼 (탭 추가, 새 워크스페이스)">
            <BSCell label="rest"><button className="bs-icon"><Icon.Plus /></button></BSCell>
            <BSCell label="hover"><button className="bs-icon hover"><Icon.Plus /></button></BSCell>
            <BSCell label="press"><button className="bs-icon press"><Icon.Plus /></button></BSCell>
            <BSCell label="disabled"><button className="bs-icon" disabled><Icon.Plus /></button></BSCell>
          </BSGroup>

          <BSGroup label="분할 / 닫기 (활성 탭 액션)">
            <BSCell label="split right"><button className="bs-action"><Icon.SplitRight /></button></BSCell>
            <BSCell label="split down"><button className="bs-action"><Icon.SplitDown /></button></BSCell>
            <BSCell label="close (hover)"><button className="bs-action danger"><Icon.X size={13} /></button></BSCell>
            <BSCell label="with hint">
              <button className="bs-kbd"><Icon.SplitRight /><kbd>⌘D</kbd></button>
            </BSCell>
          </BSGroup>

          <BSGroup label="탭 (현재 / 비활성 / 호버)">
            <div className="bs-tabs">
              <div className="bs-tab active">
                <span className="bs-tab-dot" />
                <span>dev-server</span>
                <span className="bs-tab-meta">2</span>
                <button className="bs-tab-x"><Icon.X size={10} /></button>
              </div>
              <div className="bs-tab">
                <span className="bs-tab-dot dim" />
                <span>git</span>
                <span className="bs-tab-meta">1</span>
              </div>
              <div className="bs-tab hover">
                <span className="bs-tab-dot dim" />
                <span>tests</span>
                <span className="bs-tab-meta">2</span>
              </div>
            </div>
          </BSGroup>
        </div>
      );
    }

    function BSGroup({ label, children }) {
      return (
        <div className="bs-group">
          <div className="bs-group-label">{label}</div>
          <div className="bs-group-row">{children}</div>
        </div>
      );
    }

    function BSCell({ label, children }) {
      return (
        <div className="bs-cell">
          {children}
          <span className="bs-cell-label">{label}</span>
        </div>
      );
    }

    const detailCss = `
      .ds-shell, .bs-shell {
        --bg: #0c1217;
        --bg-2: #131a22;
        --line: #1c252e;
        --line-2: #28333d;
        --accent: #5eead4;
        --fg: #e6edf3;
        --fg-2: #93a4b3;
        --fg-3: #5a6573;
        --danger: #f87171;
        width: 100%; height: 100%;
        background: var(--bg);
        color: var(--fg);
        font-family: 'Inter', sans-serif;
        padding: 28px 32px;
        display: flex; flex-direction: column; gap: 20px;
        box-sizing: border-box;
      }
      .ds-row {
        display: grid; grid-template-columns: 1fr 14px 1fr;
        height: 160px; border: 1px solid var(--line); border-radius: 10px;
        background: #07101a; overflow: hidden;
      }
      .ds-pane { display: grid; place-items: center; color: var(--fg-2); font-size: 12px; }
      .ds-div { display: grid; place-items: center; position: relative; cursor: col-resize; }
      .ds-div::before {
        content: ''; position: absolute; inset: 8px 0; left: 50%; transform: translateX(-0.5px); width: 1px;
        background: var(--line);
      }
      .ds-handle {
        position: relative; z-index: 1;
        width: 5px; height: 38px;
        display: grid; grid-template-rows: repeat(4, 1fr); gap: 3px;
        background: var(--bg-2); border: 1px solid var(--accent);
        box-shadow: 0 0 12px rgba(94,234,212,0.35);
        border-radius: 2px; padding: 4px 1px;
      }
      .ds-handle span { background: var(--accent); border-radius: 1px; }
      .ds-tooltip {
        position: absolute; top: -22px; left: 50%; transform: translateX(-50%);
        background: var(--bg-2); color: var(--accent);
        border: 1px solid var(--accent); font-size: 9.5px; padding: 2px 6px; border-radius: 3px;
        font-family: 'JetBrains Mono', monospace; letter-spacing: 0.1em;
      }
      .ds-states { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 12px; }
      .ds-state { display: grid; gap: 6px; }
      .ds-state-label { font-size: 10px; color: var(--fg-3); letter-spacing: 0.1em; font-family: 'JetBrains Mono', monospace; }
      .ds-mini { display: grid; grid-template-columns: 1fr 6px 1fr; height: 70px; background: #07101a; border: 1px solid var(--line); border-radius: 6px; overflow: hidden; }
      .ds-mini-pane { background: rgba(255,255,255,0.02); }
      .ds-mini-div { position: relative; }
      .ds-mini-div::before { content: ''; position: absolute; inset: 0; left: 50%; width: 1px; transform: translateX(-0.5px); background: var(--line); }
      .ds-rest::before { background: var(--line); }
      .ds-hover::before { background: var(--accent); box-shadow: 0 0 6px rgba(94,234,212,0.5); }
      .ds-drag::before { background: var(--accent); box-shadow: 0 0 14px rgba(94,234,212,0.7); }
      .ds-drag::after {
        content: ''; position: absolute; inset: 0; left: -200%; right: -200%;
        background: linear-gradient(90deg, transparent, rgba(94,234,212,0.15), transparent);
        pointer-events: none;
      }
      .ds-note { margin: 0; font-size: 12px; color: var(--fg-2); line-height: 1.5; max-width: 540px; }

      /* Button study */
      .bs-shell { gap: 22px; padding: 28px 32px; }
      .bs-group { display: grid; gap: 10px; }
      .bs-group-label { font-size: 10.5px; color: var(--fg-3); letter-spacing: 0.1em; text-transform: uppercase; font-family: 'JetBrains Mono', monospace; }
      .bs-group-row { display: flex; gap: 14px; align-items: flex-end; flex-wrap: wrap; }
      .bs-cell { display: grid; gap: 6px; justify-items: center; }
      .bs-cell-label { font-size: 10px; color: var(--fg-3); font-family: 'JetBrains Mono', monospace; }
      .bs-icon { width: 30px; height: 30px; border-radius: 6px; background: transparent; border: 1px solid var(--line); color: var(--fg-2); display: grid; place-items: center; cursor: pointer; }
      .bs-icon.hover { background: var(--bg-2); color: var(--fg); border-color: var(--line-2); }
      .bs-icon.press { background: rgba(94,234,212,0.08); color: var(--accent); border-color: var(--accent); }
      .bs-icon:disabled { opacity: 0.35; cursor: not-allowed; }
      .bs-action { display: inline-flex; align-items: center; gap: 6px; height: 30px; padding: 0 9px; border-radius: 6px; border: 1px solid var(--line); background: transparent; color: var(--fg); cursor: pointer; font: inherit; font-size: 11px; }
      .bs-action:hover { border-color: var(--accent); color: var(--accent); background: rgba(94,234,212,0.06); }
      .bs-action.danger { border-color: rgba(248,113,113,0.4); color: var(--danger); background: rgba(248,113,113,0.06); }
      .bs-kbd { display: inline-flex; align-items: center; gap: 8px; height: 30px; padding: 0 10px; border-radius: 6px; border: 1px solid var(--accent); background: rgba(94,234,212,0.08); color: var(--accent); font: inherit; font-size: 11px; }
      .bs-kbd kbd { background: rgba(94,234,212,0.18); color: var(--accent); border-radius: 3px; padding: 1px 5px; font-size: 10px; font-family: 'JetBrains Mono', monospace; }

      .bs-tabs { display: flex; gap: 6px; padding: 6px; background: #07101a; border: 1px solid var(--line); border-radius: 8px; }
      .bs-tab { display: flex; align-items: center; gap: 8px; padding: 6px 10px; border-radius: 6px; color: var(--fg-2); font-size: 12px; cursor: pointer; border: 1px solid transparent; }
      .bs-tab.active { background: rgba(94,234,212,0.07); border-color: rgba(94,234,212,0.3); color: var(--fg); }
      .bs-tab.hover { background: var(--bg-2); color: var(--fg); }
      .bs-tab-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--accent); box-shadow: 0 0 6px rgba(94,234,212,0.7); }
      .bs-tab-dot.dim { background: var(--fg-3); box-shadow: none; }
      .bs-tab-meta { font-size: 9.5px; color: var(--fg-3); background: var(--bg); padding: 1px 5px; border-radius: 3px; }
      .bs-tab-x { width: 16px; height: 16px; border-radius: 3px; background: transparent; border: none; color: var(--fg-3); display: grid; place-items: center; cursor: pointer; }
      .bs-tab-x:hover { background: var(--bg); color: var(--fg); }
    `;

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
